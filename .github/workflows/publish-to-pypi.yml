name: Publish Python distribution to PyPI
on: 
  push:
    tags:
      - '[0-9].[0-9]+.[0-9]+'

jobs:
  pypi-publish:
    name: Build and publish Python distribution to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cftscal
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@main
      - name: Setup Python 3.10
        uses: actions/setup-python@v3
        with:
          python-version: "3.10"
      - name: Install pypa/build
        run: >-
          python -m 
          pip install 
          build 
          --user
      # The user guide bundled into the package for viewing without a
      # network (Home's User Guide panel). Not tracked by git, so built
      # here; needs the network to download its fonts and scripts.
      - name: Build the bundled user guide
        run: |
          python -m pip install mkdocs-material
          python tools/build_guide.py
      - name: Build a binary wheel and a source tarball
        run: >-
          python -m 
          build 
          --sdist
          --wheel
          --outdir dist/
      - name: Check the user guide is in both
        run: python tools/build_guide.py --check dist
      - name: Publish distribution to PyPI
        if: startsWith(github.ref, 'refs/tags')
        uses: pypa/gh-action-pypi-publish@release/v1
