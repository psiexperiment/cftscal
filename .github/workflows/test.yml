name: Run tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      psiexperiment:
        description: 'psiexperiment to test against: main (from GitHub) or release (from PyPI)'
        type: choice
        options: [main, release]
        default: main
  # Called by publish-to-pypi.yml with psiexperiment: release, so a package
  # is only published if it works with the psiexperiment users will get.
  workflow_call:
    inputs:
      psiexperiment:
        type: string
        default: main

jobs:
  test:
    name: Tests (${{ matrix.os }}, psiexperiment ${{ inputs.psiexperiment || 'main' }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      # No display on the runners; the tests only need widgets to exist.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # sounddevice's Linux wheel, unlike the Windows one, doesn't include
      # PortAudio.
      - name: Install the libraries Qt and sounddevice need (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 libportaudio2

      # cftscal is usually developed against psiexperiment's main branch,
      # since fixes often need commits in both. Installing it first means
      # installing cftscal below finds it already satisfied.
      - name: Install psiexperiment from main
        if: (inputs.psiexperiment || 'main') == 'main'
        run: python -m pip install "psiexperiment @ git+https://github.com/psiexperiment/psiexperiment.git@main"

      # Nothing names a Qt binding: enaml and qtpy leave the choice to the
      # user. PySide6 is the one used in development and includes
      # QtWebEngine for the user guide.
      - name: Install cftscal and its test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install PySide6 -e ".[test]"

      - name: Show the psiexperiment being tested
        run: python -m pip show psiexperiment

      - name: Run tests
        run: python -m pytest
